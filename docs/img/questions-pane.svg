<svg xmlns="http://www.w3.org/2000/svg" width="540" height="574" viewBox="0 0 540 574" role="img" aria-label="Questions worth asking"><rect width="540" height="574" rx="14" fill="#1f1e1d"/><rect x="10" y="10" width="520" height="554" rx="10" fill="#2b2a28" stroke="#3d3c39"/><text x="24.0" y="35.0" fill="#ece9e4" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="14" xml:space="preserve" style="white-space:pre">Questions worth asking</text><g stroke="#8d8a85" stroke-width="1.5" fill="none"><path d="M478 32 l6 -6 m-4 0 h4 v4 M484 22"/><path d="M504 22 l10 10 m0 -10 l-10 10"/></g><line x1="10" y1="50" x2="530" y2="50" stroke="#3d3c39"/><text x="30.0" y="84.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">Tick any number (click or 1-5), then insert them together.</text><rect x="30.5" y="88.5" width="139.2" height="23" rx="6" fill="none" stroke="#3d3c39"/><text x="40.0" y="104.0" fill="#6f6d69" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11" xml:space="preserve" style="white-space:pre">1</text><text x="50.0" y="104.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">[ ] Retry ceiling</text><text x="30.0" y="128.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">What happens to queued jobs when the retry limit is hit</text><text x="30.0" y="148.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">mid-deploy in src/worker.ts?</text><rect x="30.5" y="172.5" width="142.0" height="23" rx="6" fill="none" stroke="#6a6864"/><text x="40.0" y="188.0" fill="#6f6d69" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11" xml:space="preserve" style="white-space:pre">2</text><text x="50.0" y="188.0" fill="#ece9e4" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">[x] Missing tests</text><text x="30.0" y="212.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">Which failure paths in the new retry logic have no test yet, and</text><text x="30.0" y="232.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">can you write them?</text><rect x="30.5" y="256.5" width="131.9" height="23" rx="6" fill="none" stroke="#3d3c39"/><text x="40.0" y="272.0" fill="#6f6d69" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11" xml:space="preserve" style="white-space:pre">3</text><text x="50.0" y="272.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">[ ] Config drift</text><text x="30.0" y="296.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">Do staging and production read the same RETRY_MAX, or can they</text><text x="30.0" y="316.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">drift apart?</text><rect x="30.5" y="340.5" width="130.3" height="23" rx="6" fill="none" stroke="#6a6864"/><text x="40.0" y="356.0" fill="#6f6d69" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11" xml:space="preserve" style="white-space:pre">4</text><text x="50.0" y="356.0" fill="#ece9e4" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">[x] Idempotency</text><text x="30.0" y="380.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">Is the payment step safe to run twice if a retry fires after a</text><text x="30.0" y="400.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">timeout?</text><rect x="30.5" y="424.5" width="142.0" height="23" rx="6" fill="none" stroke="#3d3c39"/><text x="40.0" y="440.0" fill="#6f6d69" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11" xml:space="preserve" style="white-space:pre">5</text><text x="50.0" y="440.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">[ ] Observability</text><text x="30.0" y="464.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">How would we notice in the logs that retries are silently</text><text x="30.0" y="484.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">masking a real outage?</text><rect x="30.0" y="508.0" width="149.3" height="24" rx="6" fill="#d97757"/><text x="42.0" y="524.0" fill="#1f1e1d" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" xml:space="preserve" style="white-space:pre">Insert 2 questions</text><rect x="195.8" y="508.5" width="93.9" height="23" rx="6" fill="none" stroke="#3d3c39"/><text x="205.3" y="524.0" fill="#6f6d69" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="11" xml:space="preserve" style="white-space:pre">a</text><text x="215.3" y="524.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">Select all</text><text x="315.3" y="524.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">Regenerate</text><text x="404.1" y="524.0" fill="#8d8a85" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif" font-size="13" xml:space="preserve" style="white-space:pre">Close</text></svg>

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mods:
    name: validate and test (${{ matrix.mod }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [token-ledger, next-steps, auto-docs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Validate
        run: claude plugin validate ${{ matrix.mod }}
      - name: Test
        run: claude plugin test ${{ matrix.mod }}

  marketplace:
    name: validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.295
      - run: claude plugin validate .
